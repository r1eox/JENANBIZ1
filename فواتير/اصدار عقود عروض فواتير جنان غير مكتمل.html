<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منشئ مستندات جنان بيز المطور</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  
  <!-- Babel CDN to compile JSX on the fly -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Premium Fonts from Google -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .cinzel { font-family: 'Cinzel', serif; }
    .montserrat { font-family: 'Montserrat', sans-serif; }
    
    @media print {
      body { background-color: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-container {
        width: 210mm !important;
        height: auto !important; 
        min-height: 297mm !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        color: black !important;
        position: relative;
        overflow: visible !important; 
        box-sizing: border-box;
      }
      @page { size: A4 portrait; margin: 0 !important; }
      
      tr, table, .avoid-break {
        page-break-inside: avoid !important;
      }
      
      .page-break-before {
        page-break-before: always !important;
        break-before: page !important;
      }

      .watermark-print {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .dotted-leader {
        flex-grow: 1;
        border-bottom: 2px dotted #cbd5e1;
        margin: 0 10px;
        position: relative;
        top: -6px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const today = new Date().toLocaleDateString('en-GB');

      const [docType, setDocType] = useState('voucher'); // 'voucher' | 'quote' | 'invoice' | 'contract'
      const [date, setDate] = useState(today);
      const [refNo, setRefNo] = useState('JB-QT-2026-010');
      
      const [clientName, setClientName] = useState('شركة برج المرح التجارية');
      const [unifiedNo, setUnifiedNo] = useState('7002228521');
      const [paymentMethod, setPaymentMethod] = useState('تحويل بنكي - مصرف الراجحي');
      const [clientCR, setClientCR] = useState('1010123456'); 
      const [clientRep, setClientRep] = useState('رامي عيظه عمر عبد الله'); 
      const [clientPhone, setClientPhone] = useState(''); 
      
      const [savedClients, setSavedClients] = useState([]);
      const [toastMsg, setToastMsg] = useState('');
      
      const [items, setItems] = useState([
        { id: 1, description: 'دراسة وتحليل الملف الائتماني والتمويلي للشركة', price: 2000 },
        { id: 2, description: 'تهيئة وتطوير ملف الأعمال والجدوى الاستشارية', price: 1000 }
      ]);

      const [paidAmount, setPaidAmount] = useState(0);

      const [showSeal, setShowSeal] = useState(true);
      const [showRequiredDocs, setShowRequiredDocs] = useState(true); 
      
      const [sealRotation, setSealRotation] = useState(-6); 
      const [sealYOffset, setSealYOffset] = useState(-30);
      const [sealXOffset, setSealXOffset] = useState(0);
      const [headerYOffset, setHeaderYOffset] = useState(0);
      const [footerYOffset, setFooterYOffset] = useState(0);
      
      const [useTax, setUseTax] = useState(false); 
      const [taxRate, setTaxRate] = useState(15);

      const companyCR = '7052623282';
      const companyAddress = 'الرياض - حي الملز - طريق عمر بن الخطاب';
      const companyEmail = 'info@jenanbiz.sa';
      const companyWebsite = 'https://jenanbiz.sa';
      const companyIBAN = 'SA4980000536608016010525';
      const companyPhone = '0592 292 920';

      const subtotal = items.reduce((acc, item) => acc + (Number(item.price) || 0), 0);
      const taxAmount = useTax ? (subtotal * taxRate) / 100 : 0;
      const totalAmount = subtotal + taxAmount;
      const remainingAmount = Math.max(0, totalAmount - paidAmount);

      useEffect(() => {
        const clients = localStorage.getItem('jinanbiz_clients');
        if (clients) {
          try { setSavedClients(JSON.parse(clients)); } catch(e) {}
        }
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const saveClient = () => {
        if (!clientName) return showToast('الرجاء إدخال اسم العميل أولاً');
        const newClient = { clientName, unifiedNo, clientCR, clientRep, clientPhone, paymentMethod };
        const filtered = savedClients.filter(c => c.clientName !== clientName);
        const updated = [...filtered, newClient];
        setSavedClients(updated);
        localStorage.setItem('jinanbiz_clients', JSON.stringify(updated));
        showToast('تم حفظ بيانات العميل بنجاح');
      };

      const loadClient = (name) => {
        const c = savedClients.find(c => c.clientName === name);
        if (c) {
          setClientName(c.clientName || '');
          setUnifiedNo(c.unifiedNo || '');
          setClientCR(c.clientCR || '');
          setClientRep(c.clientRep || '');
          setClientPhone(c.clientPhone || '');
          if(c.paymentMethod) setPaymentMethod(c.paymentMethod);
          showToast('تم استدعاء بيانات العميل');
        }
      };

      const convertNumberToArabicWords = (num) => {
        if (num === 0) return 'صفر ريال سعودي';
        const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
        const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
        const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
        const thousands = ['', 'ألف', 'ألفان', 'ثلاثة آلاف', 'أربعة آلاف', 'خمسة آلاف', 'ستة آلاف', 'سبعة آلاف', 'ثمانية آلاف', 'تسعة آلاف', 'عشرة آلاف'];

        let words = '';
        if (num >= 1000000) return num + ' ريال سعودي'; 
        let temp = num;

        if (temp >= 1000) {
          let th = Math.floor(temp / 1000);
          temp %= 1000;
          if (th <= 10) {
            words += thousands[th];
          } else {
            words += convertNumberToArabicWords(th).replace(' ريال سعودي', '') + ' ألف';
          }
        }
        if (temp >= 100) {
          let h = Math.floor(temp / 100);
          temp %= 100;
          if (words !== '') words += ' و';
          words += hundreds[h];
        }
        if (temp > 0) {
          if (words !== '') words += ' و';
          if (temp < 20) {
            words += ones[temp];
          } else {
            let o = temp % 10;
            let t = Math.floor(temp / 10);
            if (o > 0) {
              words += ones[o] + ' و' + tens[t];
            } else {
              words += tens[t];
            }
          }
        }
        return words ? `${words} ريال سعودي فقط لا غير` : '';
      };

      const amountInWords = convertNumberToArabicWords(totalAmount);

      const handleAddItem = () => {
        const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
        setItems([...items, { id: newId, description: '', price: 0 }]);
      };
      const handleDeleteItem = (id) => setItems(items.filter(item => item.id !== id));
      const handleUpdateItem = (id, field, value) => setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      const handlePrint = () => window.print();

      const handleDownloadWord = () => {
        const header = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head>
            <meta charset='utf-8'>
            <title>Contract</title>
            <style>
              body { font-family: 'Arial', sans-serif; direction: rtl; text-align: right; line-height: 1.6; }
              h1 { text-align: center; color: #1e3a8a; font-size: 20pt; }
              h2 { color: #1e3a8a; font-size: 14pt; margin-top: 20px; }
              p, li { font-size: 12pt; }
              .party { font-weight: bold; margin-bottom: 15px; }
              .signatures { display: flex; justify-content: space-between; margin-top: 50px; text-align: center;}
            </style>
          </head>
          <body>
        `;
        const footer = "</body></html>";
        const content = document.getElementById("contract-print-area").innerHTML;
        const sourceHTML = header + content + footer;

        const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        const fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = source;
        fileDownload.download = `عقد_استشارات_${clientName}.doc`;
        fileDownload.click();
        document.body.removeChild(fileDownload);
      };

      const handleDownloadHTML = () => {
        const htmlContent = `<!DOCTYPE html>\n` + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'JinanBIZ_Generator.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const requiredDocsList = [
        { id: 1, title: 'صور السجل التجاري' },
        { id: 2, title: 'عقد التأسيس (إن كانت شركة)' },
        { id: 3, title: 'صوره الهوية للمالك (الشركاء إذا كانت شركة)' },
        { id: 4, title: 'وإذا مستثمر الهوية من ابشر (موضح تاريخ الانتهاء)' },
        { id: 5, title: 'الترخيص الاستثماري إذا شركه أجنبيه' },
        { id: 6, title: 'شهاده بلدي' },
        { id: 7, title: 'شهاده التأمينات' },
        { id: 8, title: 'شهاده الزكاه والدخل' },
        { id: 9, title: 'شهاده الضريبة المضافة' },
        { id: 10, title: 'عقد الايجار للمنشاه' },
        { id: 11, title: 'العنوان الوطني للمنشاه والمالك' },
        { id: 12, title: 'موقع من جوجل' },
        { id: 13, title: 'شهاده الايبان بالباركود' },
        { id: 14, title: 'بروفايل للمنشأة', sub: '(نبذة عن النشاط، الرؤية، الهيكل التنظيمي، الأهداف)' },
        { id: 15, title: 'دراسة جدوى للمشروع', sub: '(تحليل السوق، المنافسين، التكاليف، الإيرادات المتوقعة)' }
      ];

      return (
        <div className="flex-1 flex flex-col h-screen max-h-screen">
          {}
          {toastMsg && (
            <div className="fixed top-6 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] font-bold text-sm transition-all border border-emerald-500">
              {toastMsg}
            </div>
          )}
          
          {/* Header Controls */}
          <header className="no-print bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-col lg:flex-row justify-between items-center gap-4 flex-shrink-0">
            <div className="flex items-center gap-3 w-full lg:w-auto">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20 flex-shrink-0">ج</div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  منشئ مستندات جنان بيز <span className="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full">احترافي</span>
                </h1>
                <p className="text-xs text-slate-400">توليد سندات، عروض، فواتير، وعقود</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
              {docType === 'contract' && (
                <button onClick={handleDownloadWord} className="flex items-center gap-2 bg-blue-800 hover:bg-blue-700 text-white text-xs md:text-sm px-4 py-2.5 rounded-lg transition border border-blue-600 shadow-lg shadow-blue-900/20">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  <span>تصدير Word</span>
                </button>
              )}
              <button onClick={handleDownloadHTML} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm px-4 py-2.5 rounded-lg transition border border-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>حفظ الأداة</span>
              </button>
              <button onClick={handlePrint} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs md:text-sm px-4 py-2.5 rounded-lg shadow-lg shadow-indigo-500/20 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                <span>طباعة / تصدير PDF</span>
              </button>
            </div>
          </header>

          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            
            {}
            <div className="no-print w-full lg:w-[460px] bg-slate-950 border-l border-slate-800 overflow-y-auto p-6 space-y-6 flex-shrink-0">
              
              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-400 uppercase block">تحديد نوع المستند</label>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-2">
                  <button onClick={() => setDocType('voucher')} className={`py-2 px-2 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${docType === 'voucher' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}>سند قبض</button>
                  <button onClick={() => setDocType('quote')} className={`py-2 px-2 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${docType === 'quote' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}>عرض سعر</button>
                  <button onClick={() => setDocType('invoice')} className={`py-2 px-2 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${docType === 'invoice' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}>فاتورة</button>
                  <button onClick={() => setDocType('contract')} className={`py-2 px-2 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${docType === 'contract' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}>عقد استشارات</button>
                </div>
              </div>

              <div className="space-y-4">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">البيانات الأساسية</h3>
                
                <div className="flex items-center gap-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                  <select onChange={(e) => loadClient(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-300 focus:outline-none">
                    <option value="">-- استدعاء عميل محفوظ --</option>
                    {savedClients.map(c => <option key={c.clientName} value={c.clientName}>{c.clientName}</option>)}
                  </select>
                  <button onClick={saveClient} className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white text-[10px] px-3 py-2 rounded font-bold transition">حفظ العميل</button>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" value={date} onChange={(e) => setDate(e.target.value)} placeholder="التاريخ" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none" dir="ltr" style={{textAlign: 'right'}} />
                  <input type="text" value={refNo} onChange={(e) => setRefNo(e.target.value)} placeholder="رقم المرجع" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none" dir="ltr" style={{textAlign: 'right'}} />
                </div>
                
                <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="اسم العميل / المنشأة" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none" />
                
                <div className="grid grid-cols-2 gap-3">
                  <input type="text" value={unifiedNo} onChange={(e) => setUnifiedNo(e.target.value)} placeholder="الرقم الموحد" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none" />
                  {docType !== 'contract' ? (
                     <input type="text" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} placeholder="طريقة الدفع" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none" />
                  ) : (
                     <input type="text" value={clientCR} onChange={(e) => setClientCR(e.target.value)} placeholder="رقم السجل التجاري" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none border-blue-500" />
                  )}
                </div>
                
                {docType === 'contract' && (
                    <input type="text" value={clientRep} onChange={(e) => setClientRep(e.target.value)} placeholder="اسم الممثل من بطاقة الأحوال" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none border-blue-500" />
                )}

                <input type="text" value={clientPhone} onChange={(e) => setClientPhone(e.target.value)} placeholder="رقم الجوال (للحفظ والتواصل)" className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none" />
              </div>

              {docType !== 'contract' && (
                <div className="space-y-4 pt-2">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">البنود والخدمات</h3>
                    <button onClick={handleAddItem} className="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 text-[10px] px-2.5 py-1.5 rounded-lg font-bold transition">+ إضافة</button>
                  </div>
                  <div className="space-y-2.5">
                    {items.map((item) => (
                      <div key={item.id} className="flex items-center gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                        <div className="flex-1 space-y-1.5">
                          <input type="text" value={item.description} onChange={(e) => handleUpdateItem(item.id, 'description', e.target.value)} placeholder="الوصف" className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none" />
                          <div className="flex items-center gap-1.5">
                            <input type="number" value={item.price} onChange={(e) => handleUpdateItem(item.id, 'price', e.target.value)} className="w-24 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white focus:outline-none" />
                            <span className="text-[10px] text-slate-400">ر.س</span>
                          </div>
                        </div>
                        <button onClick={() => handleDeleteItem(item.id)} className="text-red-400 hover:text-red-300 p-2 bg-red-500/10 rounded-lg transition">
                          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {docType === 'invoice' && (
                <div className="space-y-4 pt-2">

                               <li>تستحق الأتعاب عند نزول مبلغ التسهيلات فعليًا في حساب العميل أو تمكينه من الاستفادة منها، أيهما أسبق. ويلتزم بالسداد فورا عند الحصول على التسهيلات المالية.</li>
                               <li>يتم السداد والتحويل بالحساب البنكي الرسمي للطرف الأول وفق البيانات التالية:
                                  <ul className="list-none pr-6 mt-1 space-y-1 text-sm bg-slate-50 p-3 rounded border border-slate-100">
                                    <li><span className="font-bold">اسم البنك:</span> مصرف الراجحي</li>
                                    <li><span className="font-bold">اسم الحساب:</span> جنان بيز</li>
                                    <li><span className="font-bold">رقم الآيبان:</span> <span className="font-mono text-left inline-block" dir="ltr">{companyIBAN}</span></li>
                                  </ul>
                               </li>
                               <li>يقر العميل علمًا وقبولًا بأن نسبة الأتعاب المتفق عليها تم تحديدها برضاه الكامل وبعد اطلاعه وفهمه لطبيعة الخدمات المقدمة.</li>
                               <li>يسري هذا العقد لمدة ( 3 ) أشهر تبدأ من تاريخ توقيعه، ويحق لأي طرف إنهاء العقد بإشعار كتابي قبل (15) يوما . بشرط الا يخل ذلك بالحقوق المالية لـ جنان بيز عن الأعمال التي تم البدء فيها.</li>
                               <li>في حال انتهاء مدة العقد و مازالت المعاملة لدى الجهه الممولة تحت الدراسة لأي سبب كان , وحصل العميل على موافقه من هذه الجهه الممولة و استلم مبلغ التمويل , فيحق لجنان بيز اتعابها المتفق عليها مسبقا.</li>
                               <li>يحق للعميل بعد انتهاء مدة العقد الـ ( 3 ) اشهر التقديم على أي جهة اخرى.</li>
