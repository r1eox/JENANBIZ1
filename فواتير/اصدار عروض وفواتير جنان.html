<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منشئ مستندات جنان بيز المطور</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  
  <!-- Babel CDN to compile JSX on the fly -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Premium Fonts from Google -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .cinzel { font-family: 'Cinzel', serif; }
    .montserrat { font-family: 'Montserrat', sans-serif; }
    
    @media print {
      body { background-color: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-container {
        width: 210mm !important;
        height: 297mm !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        color: black !important;
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
      }
      @page { size: A4 portrait; margin: 0 !important; }
    }

    /* Scrollbar Styling for control panel */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [docType, setDocType] = useState('voucher'); // 'voucher' | 'quote' | 'invoice'
      const [date, setDate] = useState('14/07/2026');
      const [refNo, setRefNo] = useState('JB-QT-202303-010');
      
      // Client Details
      const [clientName, setClientName] = useState('شركة الأسس العربية');
      const [unifiedNo, setUnifiedNo] = useState('7033956306');
      const [paymentMethod, setPaymentMethod] = useState('تحويل بنكي - مصرف الراجحي');
      
      // Line Items
      const [items, setItems] = useState([
        { id: 1, description: 'دراسة وتحليل الملف الائتماني والتمويلي للشركة', price: 2000 },
        { id: 2, description: 'تهيئة وتطوير ملف الأعمال والجدوى الاستشارية', price: 1000 }
      ]);

      // Financials (Invoice Specific)
      const [paidAmount, setPaidAmount] = useState(0);

      const [showSeal, setShowSeal] = useState(true);
      const [showSignatures, setShowSignatures] = useState(false);
      const [sealRotation, setSealRotation] = useState(-6); 
      const [sealYOffset, setSealYOffset] = useState(-30);
      const [footerYOffset, setFooterYOffset] = useState(0);
      const [contentYOffset, setContentYOffset] = useState(0);
      const [useTax, setUseTax] = useState(false); 
      const [taxRate, setTaxRate] = useState(15);
      const [showRefundDisclaimer, setShowRefundDisclaimer] = useState(true);
      const [extractionStatus, setExtractionStatus] = useState('idle');

      // Jinan BIZ Official Static Data from contract
      const companyCR = '7052623282';
      const companyAddress = 'الرياض - طريق عمر بن الخطاب';
      const companyEmail = 'info@jenanbiz.sa';
      const companyWebsite = 'https://jenanbiz.sa';
      const companyIBAN = 'SA4980000536608016010525';

      const subtotal = items.reduce((acc, item) => acc + (Number(item.price) || 0), 0);
      const taxAmount = useTax ? (subtotal * taxRate) / 100 : 0;
      const totalAmount = subtotal + taxAmount;
      const remainingAmount = Math.max(0, totalAmount - paidAmount);

      const convertNumberToArabicWords = (num) => {
        if (num === 0) return 'صفر ريال سعودي';
        const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
        const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
        const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
        const thousands = ['', 'ألف', 'ألفان', 'ثلاثة آلاف', 'أربعة آلاف', 'خمسة آلاف', 'ستة آلاف', 'سبعة آلاف', 'ثمانية آلاف', 'تسعة آلاف', 'عشرة آلاف'];

        let words = '';
        if (num >= 1000000) return num + ' ريال سعودي'; 
        let temp = num;

        if (temp >= 1000) {
          let th = Math.floor(temp / 1000);
          temp %= 1000;
          if (th <= 10) {
            words += thousands[th];
          } else {
            words += convertNumberToArabicWords(th).replace(' ريال سعودي', '') + ' ألف';
          }
        }

        if (temp >= 100) {
          let h = Math.floor(temp / 100);
          temp %= 100;
          if (words !== '') words += ' و';
          words += hundreds[h];
        }

        if (temp > 0) {
          if (words !== '') words += ' و';
          if (temp < 20) {
            words += ones[temp];
          } else {
            let o = temp % 10;
            let t = Math.floor(temp / 10);
            if (o > 0) {
              words += ones[o] + ' و' + tens[t];
            } else {
              words += tens[t];
            }
          }
        }
        return words ? `${words} ريال سعودي فقط لا غير` : '';
      };

      const amountInWords = convertNumberToArabicWords(totalAmount);

      const handleAddItem = () => {
        const newId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;
        setItems([...items, { id: newId, description: '', price: 0 }]);
      };

      const handleDeleteItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const handleUpdateItem = (id, field, value) => {
        setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const handlePrint = () => {
        window.print();
      };

      const handleDownloadHTML = () => {
        const htmlContent = `<!DOCTYPE html>\n` + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'JinanBIZ_Generator.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setExtractionStatus('loading');
        setTimeout(() => {
          setClientName('شركة الأسس العربية');
          setUnifiedNo('7033956306');
          setExtractionStatus('success');
          setTimeout(() => setExtractionStatus('idle'), 4000);
        }, 1500);
      };

      return (
        <div className="flex-1 flex flex-col">
          {/* Main Header Controls Area (Not Printed) */}
          <header className="no-print bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-col lg:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-3 w-full lg:w-auto">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20 flex-shrink-0">
                ج
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  منشئ مستندات جنان بيز <span className="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full">احترافي</span>
                </h1>
                <p className="text-xs text-slate-400">توليد سندات قبض، عروض أسعار، وفواتير مطابقة للورق الرسمي</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
              {/* Instant Download HTML Button */}
              <button 
                onClick={handleDownloadHTML} 
                className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm px-4 py-2.5 rounded-lg transition border border-slate-700"
                title="حفظ هذا البرنامج بالكامل على جهازك ليعمل بدون انترنت"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>حفظ الأداة</span>
              </button>

              {/* Print Button */}
              <button 
                onClick={handlePrint}
                className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs md:text-sm px-4 py-2.5 rounded-lg shadow-lg shadow-indigo-500/20 transition"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                <span>طباعة</span>
              </button>
              
              {/* Export PDF Button */}
              <button 
                onClick={handlePrint}
                className="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white font-semibold text-xs md:text-sm px-4 py-2.5 rounded-lg shadow-lg shadow-red-500/20 transition"
                title="اختر حفظ كملف PDF من نافذة الطباعة"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>تصدير PDF</span>
              </button>
            </div>
          </header>

          {/* Main Split Screen Workspace */}
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            
            {/* Left Control Panel */}
            <div className="no-print w-full lg:w-[460px] bg-slate-950 border-l border-slate-800 overflow-y-auto p-6 space-y-6 flex-shrink-0">
              
              {/* Document Selector */}
              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-400 uppercase block">تحديد نوع المستند المطلوب</label>
                <div className="grid grid-cols-3 gap-2">
                  <button 
                    onClick={() => setDocType('voucher')}
                    className={`py-2 px-3 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${
                      docType === 'voucher' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'
                    }`}
                  >
                    <span>سند قبض</span>
                  </button>
                  <button 
                    onClick={() => setDocType('quote')}
                    className={`py-2 px-3 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${
                      docType === 'quote' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'
                    }`}
                  >
                    <span>عرض سعر</span>
                  </button>
                  <button 
                    onClick={() => setDocType('invoice')}
                    className={`py-2 px-3 rounded-xl flex flex-col items-center gap-1 transition text-xs font-semibold ${
                      docType === 'invoice' ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-900 text-slate-400 border border-slate-800'
                    }`}
                  >
                    <span>فاتورة مبيعات</span>
                  </button>
                </div>
              </div>

              {/* Core Client Inputs */}
              <div className="space-y-4">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">بيانات العميل والوثيقة</h3>
                
                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400">التاريخ</label>
                    <input 
                      type="text" value={date} onChange={(e) => setDate(e.target.value)} 
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400">رقم المرجع</label>
                    <input 
                      type="text" value={refNo} onChange={(e) => setRefNo(e.target.value)} 
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
                    />
                  </div>
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] text-slate-400">اسم العميل / الشركة</label>
                  <input 
                    type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} 
                    className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
                    placeholder="اسم العميل"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400">الرقم الموحد للعميل</label>
                    <input 
                      type="text" value={unifiedNo} onChange={(e) => setUnifiedNo(e.target.value)} 
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
                      placeholder="سجل العميل"
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-400">طريقة الدفع</label>
                    <input 
                      type="text" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} 
                      className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
                    />
                  </div>
                </div>
              </div>

              {/* Items Table Fields */}
              <div className="space-y-4 pt-2">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">البنود والخدمات</h3>
                  <button 
                    onClick={handleAddItem}
                    className="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 text-[10px] px-2.5 py-1.5 rounded-lg font-bold transition"
                  >
                    <span>+ إضافة خدمة</span>
                  </button>
                </div>

                <div className="space-y-2.5">
                  {items.map((item) => (
                    <div key={item.id} className="flex items-center gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                      <div className="flex-1 space-y-1.5">
                        <input 
                          type="text" value={item.description} onChange={(e) => handleUpdateItem(item.id, 'description', e.target.value)}
                          placeholder="وصف وتفاصيل الخدمة"
                          className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none"
                        />
                        <div className="flex items-center gap-1.5">
                          <span className="text-[10px] text-slate-500">السعر:</span>
                          <input 
                            type="number" value={item.price} onChange={(e) => handleUpdateItem(item.id, 'price', e.target.value)}
                            className="w-24 bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs text-white focus:outline-none"
                          />
                          <span className="text-[10px] text-slate-400">ر.س</span>
                        </div>
                      </div>
                      <button 
                        onClick={() => handleDeleteItem(item.id)}
                        className="text-red-400 hover:text-red-300 p-2 bg-red-500/10 rounded-lg transition"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Financials (Paid & Remaining) specifically for invoices, but usable generally */}
              {docType === 'invoice' && (
                <div className="space-y-4 pt-2">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2">المالية والمدفوعات</h3>
                  <div className="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                    <span className="text-xs font-semibold text-slate-300">المبلغ المدفوع (ر.س)</span>
                    <input 
                      type="number" 
                      value={paidAmount} 
                      onChange={(e) => setPaidAmount(Number(e.target.value))}
                      className="w-32 bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-sm text-emerald-400 font-bold focus:outline-none text-left"
                    />
                  </div>
                </div>
              )}

              {/* Document display sliders */}
              <div className="bg-slate-900/40 p-4 rounded-xl border border-slate-800 space-y-4 mt-6">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">إعدادات العرض والأمان</h3>

                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-300">عرض الختم الأزرق</span>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={showSeal} 
                        onChange={(e) => setShowSeal(e.target.checked)}
                        className="sr-only peer" 
                      />
                      <div className="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:-translate-x-full after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600" />
                    </label>
                  </div>

                  {showSeal && (
                    <div className="pl-3 border-r-2 border-slate-800 space-y-3 pt-1">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] text-slate-400">إمالة الختم</span>
                        <input 
                          type="range" min="-45" max="45" value={sealRotation} 
                          onChange={(e) => setSealRotation(Number(e.target.value))}
                          className="w-20 h-1 bg-slate-800 rounded-lg cursor-pointer accent-blue-500"
                        />
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] text-slate-400">موقع الختم</span>
                        <input 
                          type="range" min="-150" max="600" value={sealYOffset} 
                          onChange={(e) => setSealYOffset(Number(e.target.value))}
                          className="w-20 h-1 bg-slate-800 rounded-lg cursor-pointer accent-blue-500"
                        />
                      </div>
                    </div>
                  )}

                  {/* Sliders to raise bottom waves and coordinates */}
                  <div className="flex items-center justify-between pt-2 border-t border-slate-800/60">
                    <span className="text-xs text-slate-300">موقع الترويسة السفلية</span>
                    <div className="flex items-center gap-2">
                      <input 
                        type="range" min="-400" max="100" value={footerYOffset} 
                        onChange={(e) => setFooterYOffset(Number(e.target.value))}
                        className="w-20 h-1 bg-slate-800 rounded-lg cursor-pointer accent-blue-500"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-300">تنويه الاسترجاع</span>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={showRefundDisclaimer} 
                        onChange={(e) => setShowRefundDisclaimer(e.target.checked)}
                        className="sr-only peer" 
                      />
                      <div className="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:-translate-x-full after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600" />
                    </label>
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-300">احتساب الضريبة (15%)</span>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={useTax} 
                        onChange={(e) => setUseTax(e.target.checked)}
                        className="sr-only peer" 
                      />
                      <div className="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:-translate-x-full after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600" />
                    </label>
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-300">عرض التوقيعات</span>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={showSignatures} 
                        onChange={(e) => setShowSignatures(e.target.checked)}
                        className="sr-only peer" 
                      />
